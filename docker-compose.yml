services:
  # ── Piston (primary engine) ──────────────────────────────────────────────
  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    # Required — piston uses nsjail + cgroups to isolate each job.
    # Without this, runtimes install but every execution fails.
    privileged: true
    ports:
      - "2000:2000"
    tmpfs:
      - /piston/jobs
    volumes:
      - piston-packages:/piston/packages
      # To reuse runtimes already installed elsewhere, swap the line above for a
      # bind mount to that host path, e.g.:
      # - /Users/fachalik/Desktop/Project/skyworx/piston/data/piston/packages:/piston/packages
    environment:
      PISTON_LOG_LEVEL: warn

      # ── Outbound network for sandboxed code ──────────────────────────────
      # Default is "true" (blocked): each job gets a network namespace with only
      # loopback, so DNS fails with EAI_AGAIN and bare IPs give ENETUNREACH.
      # Set to "false" to let user code reach the internet (fetch, HTTP APIs).
      #
      # Piston parses this with `x => x === 'true'`, so any value other than the
      # exact string "true" disables the block. Compose v2+ coerces an unquoted
      # YAML boolean to "false" too, but the quotes are kept here because the
      # older Python compose v1 rejected bare booleans outright.
      #
      # This removes the sandbox's network isolation — user code can then reach
      # anything this host can, including other containers on executor-net.
      PISTON_DISABLE_NETWORKING: "false"

      # ── Ceilings piston enforces on incoming requests ────────────────────
      # These are limits, not defaults: a request asking for more is rejected
      # outright with "run_timeout cannot exceed the configured limit of N".
      # Stock default is 3000 ms — too short for real HTTP round-trips.
      PISTON_RUN_TIMEOUT: "15000"
      PISTON_COMPILE_TIMEOUT: "20000"
    networks:
      - executor-net

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      PISTON_URL: http://piston:2000

      # ── Judge0 ───────────────────────────────────────────────────────────
      # Judge0 ships its own compose stack (server + workers + postgres +
      # redis) and is not managed here, so the backend reaches it across the
      # host rather than over a shared docker network. Point this at
      # `http://judge0-server:2358` instead if you move it onto executor-net.
      JUDGE0_URL: http://host.docker.internal:2358
      # Limits the backend asks Judge0 for. Judge0 rejects anything above its
      # own max_cpu_time_limit / max_wall_time_limit / max_memory_limit —
      # check them with `curl -s localhost:2358/config_info`.
      JUDGE0_CPU_TIME_LIMIT: "5"     # seconds
      JUDGE0_WALL_TIME_LIMIT: "10"   # seconds
      JUDGE0_MEMORY_LIMIT_KB: "128000"
      # Set both only if your Judge0 has authn/authz enabled.
      # JUDGE0_AUTH_TOKEN: ""
      # JUDGE0_AUTH_USER: ""

      QUICKJS_URL: http://quickjs:3002
      ISOLATEDVM_URL: http://isolated-vm:3003
      CORS_ORIGIN: http://localhost:5173
      # What the backend ASKS piston for. Must stay <= the piston ceilings above,
      # or piston rejects every request. See backend/src/engines/piston.ts
      PISTON_RUN_TIMEOUT: "15000"
      PISTON_COMPILE_TIMEOUT: "20000"
    # Judge0 lives outside this compose project, so host.docker.internal above
    # needs an explicit mapping on Linux (Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - piston
      - quickjs
      - isolated-vm
    networks:
      - executor-net
      # The only route to the quickjs service, which sits on an internal
      # network with no gateway of its own.
      - sandbox-net

  # ── QuickJS executor (WASM sandbox, no container runtime needed) ──────────
  quickjs:
    build:
      context: ./quickjs-code-executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3002
      QUICKJS_TIMEOUT_MS: "5000"
      QUICKJS_MAX_TIMEOUT_MS: "10000"
      QUICKJS_MEMORY_BYTES: "67108864"      # 64 MB
      QUICKJS_MAX_MEMORY_BYTES: "134217728" # 128 MB
      QUICKJS_MAX_CONCURRENT: "4"

    # Guest code cannot open a socket — `fetch` is stubbed out and there is no
    # `net`/`http` module to import — so the sandbox needs no egress. Cutting it
    # off at the container level too turns that from a promise into something an
    # auditor can check from outside the process.
    #
    # sandbox-net is `internal: true`, so it has no gateway and this container
    # has no route off the host. That only holds while this is its ONLY network:
    # a second leg on executor-net would hand back the egress this removes.
    # It also means no published port — reach the service through the backend,
    # or `docker compose exec quickjs wget -qO- localhost:3002/health`.
    networks:
      - sandbox-net

    # Defence in depth around the WASM boundary. The process only needs to read
    # its own bundle and listen on a port.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # A CPU-bound script pins one event loop for its whole timeout, so cap what
    # a saturated executor can take from the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  # ── isolated-vm executor (real V8 isolate, native addon) ─────────────────
  isolated-vm:
    build:
      context: ./isolated-vm-code-executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3003
      ISOLATEDVM_TIMEOUT_MS: "5000"
      ISOLATEDVM_MAX_TIMEOUT_MS: "10000"
      ISOLATEDVM_MEMORY_BYTES: "67108864"      # 64 MB
      ISOLATEDVM_MAX_MEMORY_BYTES: "134217728" # 128 MB
      # An isolate evaluates on its own thread rather than on the event loop, so
      # this can sit higher than the QuickJS service's. The ceiling that matters
      # is heap: maxConcurrent * maxMemory must fit the container limit below.
      ISOLATEDVM_MAX_CONCURRENT: "4"

    # Same posture as the quickjs service, for the same reason. A V8 isolate has
    # no Node bindings at all — no require, no process, no fetch, no timers — so
    # guest code cannot open a socket. Cutting egress at the container level too
    # turns that from a promise into something an auditor can check from outside.
    #
    # sandbox-net is `internal: true`, so it has no gateway and this container
    # has no route off the host. That only holds while this is its ONLY network:
    # a second leg on executor-net would hand back the egress this removes.
    # It also means no published port — reach the service through the backend, or
    # `docker compose exec isolated-vm wget -qO- localhost:3003/health`.
    networks:
      - sandbox-net

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 4 concurrent isolates at the 128 MB ceiling is 512 MB of guest heap before
    # the host process's own footprint, so this is deliberately roomier than the
    # WASM sandbox's limit.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - executor-net

networks:
  executor-net:
  # No gateway: containers attached to this network have no route out.
  sandbox-net:
    internal: true

volumes:
  piston-packages:
